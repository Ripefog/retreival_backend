version: "3.8"

services:
  # Backend API Server
  backend:
    container_name: video-retrieval-backend
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - MILVUS_URI=${MILVUS_URI:-}
      - MILVUS_TOKEN=${MILVUS_TOKEN:-}
      - MILVUS_HOST=${MILVUS_HOST:-0.tcp.ap.ngrok.io}
      - MILVUS_PORT=${MILVUS_PORT:-13216}
      - METACLIP2_COLLECTION=${METACLIP2_COLLECTION:-arch_metaclip2_image_v100}
      - BEIT3_COLLECTION=${BEIT3_COLLECTION:-arch_beit3_image_v100}
      - OBJECT_COLLECTION=${OBJECT_COLLECTION:-arch_metaclip2_object_name_v100}
      - METACLIP2_MODEL_NAME=${METACLIP2_MODEL_NAME:-facebook/metaclip-2-worldwide-huge-quickgelu}
      - METACLIP2_DIM=${METACLIP2_DIM:-1024}
      - HF_CACHE_DIR=${HF_CACHE_DIR:-/app/models/huggingface}
      - OPENSEARCH_HOST=${OPENSEARCH_HOST:-localhost}
      - OPENSEARCH_PORT=${OPENSEARCH_PORT:-9200}
      - OPENSEARCH_USERNAME=${OPENSEARCH_USERNAME:-admin}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:-your_password}
      - OPENSEARCH_USE_SSL=${OPENSEARCH_USE_SSL:-false}
      - OPENSEARCH_VERIFY_CERTS=${OPENSEARCH_VERIFY_CERTS:-false}
      - DEVICE=${DEVICE:-cpu}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=false
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (optional)
  nginx:
    container_name: nginx-proxy
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    profiles:
      - production

  # Redis Cache (optional)
  redis:
    container_name: redis-cache
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    profiles:
      - production

volumes:
  redis_data:
